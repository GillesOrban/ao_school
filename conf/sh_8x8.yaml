simName:               # if simName is not defined (None) data are not saved
pupilSize: 100
nGS: 1
nDM: 2
nSci: 1
nIters: 500
loopTime: 0.0025
threads: 4

verbosity: 2

saveCMat: True
saveSlopes: True
saveDmCommands:   True
saveLgsPsf: True
saveInstPsf: True
saveSciPsf: True
saveSciRes: True


Atmosphere:
  scrnNo: 4
  scrnHeights: [0, 5000, 10000, 15000]
  scrnStrengths: [0.5, 0.3, 0.1, 0.1]
  windDirs: [0, 45, 90, 135]
  windSpeeds: [10, 10, 15, 20]
  wholeScrnSize: 2048
  r0: 0.16
  L0: [20, 20, 20, 20]
  infinite: True


Telescope:
  telDiam: 2.4
  obsDiam: 0 #2.1
  mask: circle

WFS:
  0:
    type: ShackHartmann
    GSPosition: [0, 0]
    GSHeight: 0
    GSMag: 8
    nxSubaps: 8
    pxlsPerSubap: 10
    subapFOV: 2.5
    wavelength: 600e-9
    photonNoise: False

DM:
  0:
    type: TT
    closed: True
    gain: 0.5
    iMatValue: 0.25


  1:
    type: FastPiezo
    closed: True
    nxActuators: 9
    gain: 0.5
    iMatValue: 500

Reconstructor:
  type: MVM
  svdConditioning: 0.03

Science:
  0:
    position: [0, 0]
    FOV: 1.0
    wavelength: 1.e-6
    pxls: 64

